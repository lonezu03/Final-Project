app:
  security:
    whitelist:
      - GET:/v3/api-docs/**
      - GET:/swagger-ui/**
      - GET:/swagger-ui.html
      - GET:/webjars/**
      - POST:/novel/search/**
      - POST:/user/login
      - POST:/user/sendOTP
      - POST:/user/createUser
      - POST:/user/loginByEmail
      - POST:/chapter/getAll
      - GET:/chapter/increaseViewChapter/**
      - GET:/category/getAll
      - GET:/author/getAll
      - GET:/author/**
      - GET:/comment/getAllByChapter/**
      - GET:/comment/getAllByNovel/**
      - GET:/novel/**
      - GET:/api/fetch-html
      - POST:/api/tts/speak
      - POST:/api/tts/sub-callback
      - GET:/api/tts/status/**
      - GET:/api/tts/audio/**
      - GET:/ws/**
      - POST:/ws/**
      - OPTIONS:/ws/**
      - GET:/send-private/**
    endpoints:
      "[user/**]": "GET,POST,PUT,DELETE,PATCH:member,admin,manager"
      "[/project/getAll]": "GET: member, manager, admin"
      "[/project/getByProjectId/**]": "GET: member, manager, admin"
      "[/project/createProject]": "POST: manager, admin"
      "[/project/addUser]": "POST: manager, admin"
      "[/project/addTask]": "POST: manager, admin"
      "[/project/removeUser]": "POST: manager, admin"
      "[/project/removeTask]": "POST: manager, admin"
      "[/project/updateProject]": "PUT: manager, admin"
      "[/project/deleteProject/**]": "DELETE: manager, admin"

      "[/task/getAll]": "GET: member, manager, admin"
      "[/task/getByTaskId/**]": "GET: member, manager, admin"
      "[/task/createTask]": "POST: member, manager, admin"
      "[/task/addUser]": "POST: member, manager, admin"
      "[/task/removeTask]": "POST: member, manager, admin"
      "[/task/updateTask]": "PUT: member, manager, admin"
      "[/task/deleteTask/**]": "DELETE: member, manager, admin"
